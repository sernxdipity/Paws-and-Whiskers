<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Groomers | Paws & Whiskers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <style>
        .team-header { text-align: center; padding: 80px 30px 50px; }
        .section-label { color: #789b75; font-size: 13px; font-weight: bold; letter-spacing: 2px; margin-bottom: 12px; }
        .team-header h1 { font-size: 46px; margin-bottom: 15px; }
        .team-header p { color: #666; font-size: 17px; max-width: 600px; margin: auto; }
        
        .team-grid { max-width: 1100px; margin: 0 auto 100px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 40px; padding: 0 30px; }
        .groomer-card { background: white; border-radius: 25px; padding: 40px 20px; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.06); cursor: pointer; transition: all 0.3s ease; border: 1px solid transparent; }
        .groomer-card:hover { transform: translateY(-10px); box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-color: #e4eee2; }
        
        /* Updated for Images */
        .groomer-avatar { width: 130px; height: 130px; background: #f4efe8; border-radius: 50%; margin: 0 auto 20px; overflow: hidden; box-shadow: inset 0 4px 10px rgba(0,0,0,0.05); }
        .groomer-avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .groomer-card h3 { font-family: "DM Serif Display", serif; font-size: 26px; margin-bottom: 5px; color: #333; }
        .groomer-specialty { color: #789b75; font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; backdrop-filter: blur(5px); }
        .modal-overlay.active { display: flex; opacity: 1; }
        
        .modal-content { background: white; padding: 45px; border-radius: 30px; max-width: 600px; width: 90%; position: relative; text-align: center; transform: translateY(30px); transition: transform 0.3s ease; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        
        .close-btn { position: absolute; top: 20px; right: 25px; font-size: 32px; cursor: pointer; background: none; border: none; color: #aaa; transition: 0.2s; line-height: 1; }
        .close-btn:hover { color: #333; transform: scale(1.1); }
        
        .modal-stats { display: flex; justify-content: center; gap: 30px; margin: 25px 0; padding: 20px 0; border-top: 1px solid #eee; border-bottom: 1px solid #eee; }
        .stat-item strong { display: block; font-size: 24px; color: #333; font-family: "DM Serif Display", serif; }
        .stat-item span { font-size: 13px; color: #666; text-transform: uppercase; letter-spacing: 1px; }
        
        .modal-bio { color: #555; line-height: 1.8; font-size: 15px; margin-bottom: 25px; }
        .modal-cert { font-size: 13px; color: #567353; font-weight: bold; background: #e4eee2; padding: 8px 18px; border-radius: 20px; display: inline-flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">🐾Paws & Whiskers</a>
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="service.html">Services</a>
                <a href="packages.html">Packages</a>
                <a href="groomers.html">Our Groomers</a>
                <a href="contact.html">Contact</a>
                <a href="booking.html" class="book-btn">Book Appointment</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="team-header">
            <p class="section-label">MEET THE TEAM</p>
            <h1>Our Expert Groomers</h1>
            <p>Click on any stylist to view their professional portfolios, specialties, and client satisfaction scores.</p>
        </section>

        <section class="team-grid" id="teamGrid"></section>
    </main>

    <div class="modal-overlay" id="groomerModal" onclick="closeOnOverlay(event)">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">×</button>
            <div class="groomer-avatar" style="width:100px; height:100px;">
                <img id="modalAvatar" src="" alt="Groomer Portrait">
            </div>
            <h2 id="modalName" style="font-family: 'DM Serif Display', serif; font-size: 34px; margin-bottom: 5px;">Name</h2>
            <p id="modalSpecialty" class="groomer-specialty"></p>
            
            <div class="modal-stats">
                <div class="stat-item">
                    <strong id="modalExp"></strong>
                    <span>Experience</span>
                </div>
                <div class="stat-item">
                    <strong id="modalScore"></strong>
                    <span>Client Score</span>
                </div>
            </div>
            
            <p id="modalBio" class="modal-bio"></p>
            <div class="modal-cert">Certified: <span id="modalCert"></span></div>
        </div>
    </div>

    <script src="js/navigation.js"></script>
    <script>
        const groomersData = [
            { id: 1, imgSrc: "images/groomer-sarah.jpg", name: "Sarah Jenkins", experience: "6 Years", score: "4.9/5", specialty: "Terrier Scissor Styling", cert: "Master Pet Stylist", bio: "Sarah is a master with scissors, specializing in the precision cuts required for Terrier breeds." },
            { id: 2, imgSrc: "images/groomer-david.jpg", name: "David Chen", experience: "8 Years", score: "5.0/5", specialty: "Anxious Cat Therapy", cert: "Feline Master Groomer", bio: "David is our resident feline whisperer. He employs advanced anxiety-reducing techniques for cats." },
            { id: 3, imgSrc: "images/groomer-emma.jpg", name: "Emma Watson", experience: "3 Years", score: "4.8/5", specialty: "Puppy Introductions", cert: "Fear-Free Professional", bio: "Emma loves introducing puppies to their very first grooming experience using positive reinforcement." }
        ];

        const teamGrid = document.getElementById('teamGrid');
        const modalOverlay = document.getElementById('groomerModal');

        function renderGroomers() {
            groomersData.forEach(groomer => {
                const card = document.createElement('div');
                card.className = 'groomer-card';
                card.onclick = () => openModal(groomer.id);
                card.innerHTML = `
                    <div class="groomer-avatar"><img src="${groomer.imgSrc}" alt="${groomer.name}"></div>
                    <h3>${groomer.name}</h3>
                    <p class="groomer-specialty">${groomer.specialty}</p>
                `;
                teamGrid.appendChild(card);
            });
        }

        function openModal(id) {
            const groomer = groomersData.find(g => g.id === id);
            document.getElementById('modalAvatar').src = groomer.imgSrc;
            document.getElementById('modalName').innerText = groomer.name;
            document.getElementById('modalSpecialty').innerText = groomer.specialty;
            document.getElementById('modalExp').innerText = groomer.experience;
            document.getElementById('modalScore').innerText = groomer.score;
            document.getElementById('modalBio').innerText = groomer.bio;
            document.getElementById('modalCert').innerText = groomer.cert;
            
            modalOverlay.style.display = 'flex';
            setTimeout(() => modalOverlay.classList.add('active'), 10);
        }

        function closeModal() { 
            modalOverlay.classList.remove('active');
            setTimeout(() => modalOverlay.style.display = 'none', 300);
        }
        
        function closeOnOverlay(e) { if (e.target === modalOverlay) closeModal(); }

        renderGroomers();
    </script>
</body>
</html>
